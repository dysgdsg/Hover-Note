name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: 取回代码
        uses: actions/checkout@v4

      - name: 编译
        shell: powershell
        run: |
          $p = Start-Process -FilePath powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','tools\build.ps1' -NoNewWindow -Wait -PassThru -RedirectStandardOutput build.out -RedirectStandardError build.err
          if (Test-Path build.out) { Get-Content build.out | Write-Host }
          if (Test-Path build.err) { Get-Content build.err | Write-Host }
          Write-Host ('exit=' + $p.ExitCode)
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 失败时把日志推到 ci-log 分支
        if: failure()
        shell: powershell
        run: |
          git config user.name hovernote-ci
          git config user.email ci@users.noreply.github.com
          git checkout -B ci-log
          $log = @()
          $log += ('PSVersion: ' + $PSVersionTable.PSVersion.ToString())
          $log += ('csc64 exists: ' + (Test-Path 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'))
          $log += ('csc32 exists: ' + (Test-Path 'C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe'))
          if (Test-Path build.out) { $log += '--- stdout ---'; $log += Get-Content build.out }
          if (Test-Path build.err) { $log += '--- stderr ---'; $log += Get-Content build.err }
          $log | Set-Content ci-last.log -Encoding utf8
          git add -f ci-last.log
          git commit -m 'ci log'
          git push -f origin ci-log

      - name: 生成校验值
        shell: powershell
        run: |
          $lines = Get-ChildItem dist\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $lines | Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: 发布 Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist\HoverNote-Setup.exe dist\Uninstall.exe dist\SHA256SUMS.txt --title "HoverNote ${{ github.ref_name }}" --notes-file .github\release-notes.md
